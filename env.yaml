name: cs224n
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Qwen training/eval runs on Python 3.10 + PyTorch; the Gemma 4 JAX path
  # (lib/gemma_jax/) needs Python >= 3.12 and is therefore kept in a separate
  # env (see env-jax.yaml).  This file covers the Qwen/PyTorch side only.
  - python=3.10
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=12.4
  - numpy
  - scipy
  - matplotlib
  - pandas
  - scikit-learn
  - tqdm
  - jupyter
  - pip
  - pip:
      - anthropic
      # transformers>=5.0 ships the Gemma 4 family (retained for legacy
      # tokenizer access inside lib/gemma/dataprep if still used).
      - transformers>=5.0
      - datasets
      # google-genai for Gemini 3.x teacher-LLM hierarchization in lib/gemma/dataprep
      - google-genai
      - tokenizers
      - evaluate
      - accelerate
      - sentencepiece
      - wandb
      - tenacity
      - matplotlib
      - huggingface_hub
      - math-verify
      - trl
      - modal
      - deepspeed
