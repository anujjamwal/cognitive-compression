name: cs224n
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=12.4
  - numpy
  - scipy
  - matplotlib
  - pandas
  - scikit-learn
  - tqdm
  - jupyter
  - pip
  - pip:
      - anthropic
      # transformers>=5.0 ships Gemma 4 (Gemma4ForCausalLM, Gemma4TextConfig,
      # per-layer-type DynamicCache dispatch via config.layer_types).
      - transformers>=5.0
      - datasets
      # google-genai for Gemini 3.x teacher-LLM hierarchization in lib/gemma/dataprep
      - google-genai
      - tokenizers
      - evaluate
      - accelerate
      - sentencepiece
      - wandb
      - tenacity
      - matplotlib
      - huggingface_hub
      - math-verify
      - trl
      - modal
      - deepspeed
